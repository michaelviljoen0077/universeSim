[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "universesim"
version = "0.1.0"
description = "A 3D, physics-based space sandbox inspired by Universe Sandbox."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "panda3d>=1.10",
    "panda3d-simplepbr>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["astroquery>=0.4"]   # JPL Horizons access for building presets (Phase 1+)

[project.scripts]
universesim = "universesim.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
